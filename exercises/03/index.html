<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget Tracker - Exercise 03</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <main class="container">
        <h1>Budget Tracker</h1>
        
        <!-- Formulario de gastos -->
        <form id="expense-form">
            <div class="form-group">
                <label for="expense-name">Expense Name:</label>
                <input type="text" id="expense-name" name="expense-name" placeholder="Ej. Groceries">
            </div>
            <div class="form-group">
                <label for="expense-amount">Amount:</label>
                <input type="number" id="expense-amount" name="expense-amount" step="0.01" placeholder="Ej. 25.50">
            </div>
            <button type="submit" id="add-btn">Add Expense</button>
        </form>

        <!-- Lista de gastos renderizada dinámicamente -->
        <section class="list-section">
            <h2>Expenses List</h2>
            <ul id="expense-list"></ul>
        </section>

        <!-- Total acumulado -->
        <div class="total-section">
            <h3>Total Spent: $<span id="total">0.00</span></h3>
        </div>
    </main>

    <!-- Script principal de Vite -->
    <script type="module" src="./src/main.js"></script>
</body>
</html>
